[bastion]
bastion ansible_host=34.230.155.214

[app]
app ansible_host=10.0.2.20

[app:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -o StrictHostKeyChecking=no -W %h:%p -i ~/.ssh/my-devops-key.pem ubuntu@34.230.155.214"'

[all:vars]
