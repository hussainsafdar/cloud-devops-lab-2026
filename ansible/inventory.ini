[bastion]
bastion ansible_host=3.209.63.53

[app]
app ansible_host=10.0.2.92

[app:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -o StrictHostKeyChecking=no -W %h:%p -i ~/.ssh/my-devops-key.pem ubuntu@3.209.63.53"'

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/my-devops-key.pem
ansible_ssh_extra_args='-o StrictHostKeyChecking=no'
